<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress harmless Vite HMR WebSocket connection logs in sandboxed iframe environment
      (function() {
        if (typeof window === 'undefined') return;
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket'))) {
            return;
          }
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket'))) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('[vite]')) {
            event.preventDefault();
          }
        });
      })();
    </script>
